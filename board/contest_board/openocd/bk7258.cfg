# ============================================================================
# vendor/beken/boards/bk7258/bk7258-devkit/openocd/bk7258.cfg
#
# OpenOCD config: DAP-Link (CMSIS-DAP) debugging the BK7258 core running
# NuttX over SWD.
#
# Purpose: when plain serial bring-up hits a wall, use SWD to halt the core
# and read PC / fault registers to locate where it crashes.
#
# Hardware: DAP-Link (USB SWD/JTAG, CMSIS-DAP firmware).
#
# Wiring (DAP-Link -> BK7258, see README_zh-cn.md in this directory):
#     TMS/IO  -> SWDIO = P21 (QFN pin 84)
#     TCK/CK  -> SWCLK = P20 (QFN pin 83)
#     GND     -> GND
#     nRST    -> CEN   (QFN pin 44)   <-- required, for connect-under-reset
#     3V3/5V  -> not connected (board is USB powered)
#
# Start:
#     openocd -f bk7258.cfg
# or probe slowly first:
#     openocd -f bk7258.cfg -c "adapter speed 200"
#
# Then in another terminal:
#     telnet localhost 4444          (OpenOCD command line)
#   or
#     arm-none-eabi-gdb nuttx -ex "target extended-remote :3333"
# ============================================================================

# ---------------------------------------------------------------------------
# 1) Adapter: CMSIS-DAP over SWD
# ---------------------------------------------------------------------------
adapter driver cmsis-dap
transport select swd

# Long thin jumper wires have poor signal quality; start slow (500kHz).
# Once stable you can raise it in telnet with "adapter speed 4000".
adapter speed 500

# ---------------------------------------------------------------------------
# 2) Reset config: connect under reset (important!)
#
# Reason: P20/P21 double as I2C/ADC/LCD on the BK7258.  Once the firmware
# runs it may re-mux these pins and disable SWD (the DAP-Link manual warns
# about this).  The fix is to wire nRST (CEN) so OpenOCD asserts reset on
# connect and halts the core before the firmware re-muxes the pins.
#
# If you did not wire nRST, comment out the three lines below and use:
#   reset_config none
# ---------------------------------------------------------------------------
reset_config srst_only srst_nogate connect_assert_srst
adapter srst delay 100
adapter srst pulse_width 100

# ---------------------------------------------------------------------------
# 3) DAP and target
#
# IDCODE unknown, so skip the check (-ignore-version) and accept any ID.
# The BK7258 core is treated as ARM Cortex-M; the cortex_m driver auto
# detects the specific core (M0/M3/M4/M7/M33).
# ---------------------------------------------------------------------------
set _CHIPNAME bk7258
set _CPUTAPID 0

swd newdap $_CHIPNAME cpu -ignore-version
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
target create $_CHIPNAME.cpu cortex_m -dap $_CHIPNAME.dap

# Halt right after reset, do not let the core run (avoids the firmware
# re-muxing the SWD pins).
$_CHIPNAME.cpu configure -event reset-init {
    echo ">> reset-init: core halted at the reset entry"
}

# The BK7258 cores are Cortex-M33 with SWD/JTAG unlocked.  SWD is
# "single core multiplexed": the JTAG-DP connects to one ARM core at a
# time, selected by a system register:
#   SYS_CPU_STORAGE_CONNECT_OP_SELECT @ 0x44010008,
#   field JTAG_CORE_SEL bit[8:7] (mask 0x3).  Write cpu_id (0/1/2) to bit7
#   to route the debug port to that core.
# Pin GROUP0: GPIO20=TCK(SWCLK)=pin83, GPIO21=TMS(SWDIO)=pin84.
# If you suspect the wrong core is routed, use jtag_core_sel below after
# attach.

# ---------------------------------------------------------------------------
# 4) Memory layout notes (for manual memory inspection in gdb/telnet)
#
#   FLASH (XIP) : 0x02010000  .vectors/.text/.rodata/.data(LMA)
#                 0x02010000 = initial SP word   (vector table [0])
#                 0x02010004 = reset vector (Thumb) (vector table [1])
#   SRAM        : 0x28010000  LEN 0x54000  .data/.bss/heap
#   UART0 base  : 0x44820000  (NuttX console)
#   SCB         : 0xE000ED00
# ---------------------------------------------------------------------------

# ===========================================================================
# Helper commands (type them in telnet localhost 4444)
# ===========================================================================

# faultinfo : decode the Cortex-M fault status registers to see the crash
#             type/address at a glance.  The core must be halted.
proc faultinfo {} {
    echo "==================== Cortex-M fault status ===================="
    set cfsr  [expr {[mrw 0xE000ED28]}]
    set hfsr  [expr {[mrw 0xE000ED2C]}]
    set mmfar [expr {[mrw 0xE000ED34]}]
    set bfar  [expr {[mrw 0xE000ED38]}]
    set icsr  [expr {[mrw 0xE000ED04]}]
    set shcsr [expr {[mrw 0xE000ED24]}]

    echo [format "CFSR  = 0x%08x  (MMFSR/BFSR/UFSR combined)" $cfsr]
    echo [format "HFSR  = 0x%08x  (HardFault status)"         $hfsr]
    echo [format "MMFAR = 0x%08x  (MemManage fault address)"  $mmfar]
    echo [format "BFAR  = 0x%08x  (BusFault fault address)"   $bfar]
    echo [format "SHCSR = 0x%08x"                             $shcsr]
    echo [format "ICSR  = 0x%08x  (low 9 bits = VECTACTIVE)"  $icsr]
    echo "--------------------------------------------------------------"

    # --- MemManage (CFSR bit 0..7) ---
    if {$cfsr & 0x01}   { echo "  [MMFSR.IACCVIOL ] instruction access violation" }
    if {$cfsr & 0x02}   { echo "  [MMFSR.DACCVIOL ] data access violation (MPU)" }
    if {$cfsr & 0x08}   { echo "  [MMFSR.MUNSTKERR] MemManage on exception unstacking" }
    if {$cfsr & 0x10}   { echo "  [MMFSR.MSTKERR  ] MemManage on exception stacking" }
    if {$cfsr & 0x80}   { echo "  [MMFSR.MMARVALID] MMFAR valid -> see MMFAR above" }

    # --- BusFault (CFSR bit 8..15) ---
    if {$cfsr & 0x100}  { echo "  [BFSR.IBUSERR   ] instruction bus error" }
    if {$cfsr & 0x200}  { echo "  [BFSR.PRECISERR ] precise data bus error -> see BFAR" }
    if {$cfsr & 0x400}  { echo "  [BFSR.IMPRECISERR] imprecise data bus error" }
    if {$cfsr & 0x800}  { echo "  [BFSR.UNSTKERR  ] BusFault on exception unstacking" }
    if {$cfsr & 0x1000} { echo "  [BFSR.STKERR    ] BusFault on exception stacking" }
    if {$cfsr & 0x8000} { echo "  [BFSR.BFARVALID ] BFAR valid -> see BFAR above" }

    # --- UsageFault (CFSR bit 16..25) ---
    if {$cfsr & 0x10000}  { echo "  [UFSR.UNDEFINSTR] undefined instruction" }
    if {$cfsr & 0x20000}  { echo "  [UFSR.INVSTATE  ] invalid state (EPSR.T=0, non-Thumb PC)" }
    if {$cfsr & 0x40000}  { echo "  [UFSR.INVPC     ] invalid PC (bad EXC_RETURN)" }
    if {$cfsr & 0x80000}  { echo "  [UFSR.NOCP      ] coprocessor/FPU access with FPU off" }
    if {$cfsr & 0x1000000} { echo "  [UFSR.UNALIGNED ] unaligned access" }
    if {$cfsr & 0x2000000} { echo "  [UFSR.DIVBYZERO ] divide by zero" }

    # --- HardFault ---
    if {$hfsr & 0x2}        { echo "  [HFSR.VECTTBL   ] vector table read error (bad VTOR?)" }
    if {$hfsr & 0x40000000} { echo "  [HFSR.FORCED    ] escalated from cfg/bus/usage fault" }

    echo "=============================================================="
    echo "Then locate the site: reg pc ; reg lr ; reg sp ; reg xpsr"
}

# bkhalt : reset and halt at the entry, print core registers.
proc bkhalt {} {
    reset halt
    echo ">> reset halt done, core at reset entry.  Core registers:"
    reg pc
    reg sp
    reg lr
    reg xpsr
    echo ">> Tip: to run to the crash, use 'resume' then 'halt' then 'faultinfo'"
}

# jtag_core_sel <cpu_id> : route the SWD/JTAG debug port to a given ARM core
#   (0/1/2).  Writes the JTAG_CORE_SEL field bit[8:7] of
#   SYS_CPU_STORAGE_CONNECT_OP_SELECT (0x44010008).  The core must be halted.
proc jtag_core_sel {cpu_id} {
    set addr 0x44010008
    set old  [expr {[mrw $addr]}]
    set new  [expr {($old & ~(0x3 << 7)) | (($cpu_id & 0x3) << 7)}]
    mww $addr $new
    echo [format ">> JTAG_CORE_SEL: 0x%08x -> 0x%08x (route to CPU%d)" \
          $old [expr {[mrw $addr]}] $cpu_id]
    echo ">> Note: a 'dap init' / reconnect may be needed to take effect"
}

# vt : print the first two vector table entries (initial SP + reset vector)
#      at the flash head to check the value the bootloader reads.
proc vt {} {
    echo "vector table @0x02010000:"
    echo [format "  initial SP  = 0x%08x  (should be 0x28010000..0x28064000)" \
          [expr {[mrw 0x02010000]}]]
    echo [format "  reset vector= 0x%08x  (Thumb, LSB should be 1)" \
          [expr {[mrw 0x02010004]}]]
}

echo ""
echo ">>>> BK7258 OpenOCD config loaded.  Common commands:"
echo ">>>>   bkhalt     - reset and halt at entry, print PC/SP/LR/xPSR"
echo ">>>>   faultinfo  - decode fault registers (core halted)"
echo ">>>>   vt         - check flash-head vector table SP/reset"
echo ">>>>   jtag_core_sel <0|1|2> - route debug port to a given core"
echo ">>>>   reg        - print all registers"
echo ">>>>   halt/resume/step - halt/continue/step"
echo ""
